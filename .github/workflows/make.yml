name: C/C++ with Make

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: Configure and build with Unix Makefiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison

      - name: Configure Make build tree
        run: |
          cmake -S . -B build/make -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with make
        run: make -C build/make -j2

      - name: Run parser, Wire, and client scanner smoke tests
        run: |
          ctest --test-dir build/make --output-on-failure \
            -R '^(test_parser|wire_test)$'
