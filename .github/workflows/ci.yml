name: RUCBase CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:
    inputs:
      run_lab_tests:
        description: Run all teaching-lab black-box tests
        required: false
        type: boolean
        default: false
      run_full_quality:
        description: Run nightly ThreadSanitizer smoke tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison \
            clang-18 \
            clang-tidy-18

      - name: Configure strict Clang build
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset quality \
            -DRUCBASE_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-18 \
            -DRUCBASE_RUN_CLANG_TIDY_EXECUTABLE=/usr/bin/run-clang-tidy-18

      - name: Build with warnings as errors
        run: cmake --build --preset quality --parallel 2

      - name: Run clang-tidy
        run: cmake --build --preset quality --target check-clang-tidy --parallel 2

      - name: Run strict-build smoke tests
        run: ctest --preset quality-smoke

  cmake:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (GCC)
            artifact_suffix: linux
          - os: macos-15-intel
            name: macOS (Intel)
            artifact_suffix: macos-intel
          - os: macos-15
            name: macOS (Apple Silicon)
            artifact_suffix: macos-arm64

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install flex bison
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_lab_tests && runner.os == 'Linux' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_lab_tests && runner.os == 'Linux' }}
        run: python -m pip install --upgrade pip pytest

      - name: Configure Debug
        run: cmake --preset debug

      - name: Build Debug
        run: cmake --build --preset debug --parallel 2

      # Storage/index/transaction tests intentionally cover unfinished lab TODOs.
      # Keep framework tests required while the skeleton is taught.
      - name: Run framework smoke tests
        run: ctest --preset smoke

      - name: Run teaching-lab black-box tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_lab_tests && runner.os == 'Linux' }}
        run: |
          ctest --preset blackbox

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-logs-${{ matrix.artifact_suffix }}
          path: |
            build/debug/test-logs
            build/debug/Testing/Temporary
          if-no-files-found: ignore

  windows-msys2:
    name: Windows (MSYS2/POSIX)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # MSYS2 tools expect Unix line endings; configure Git before checkout.
      - name: Configure Git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            git
            gcc
            cmake
            flex
            bison

      - name: Configure Debug
        shell: msys2 {0}
        # MSYS2 hides POSIX declarations such as fileno/mkstemp in strict C++ mode.
        run: cmake --preset debug -DCMAKE_CXX_FLAGS=-D_POSIX_C_SOURCE=200809L

      - name: Build Debug
        shell: msys2 {0}
        run: cmake --build --preset debug --parallel 2

      - name: Run framework smoke tests
        shell: msys2 {0}
        run: ctest --preset smoke

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-logs-windows-msys2
          path: |
            build/debug/test-logs
            build/debug/Testing/Temporary
          if-no-files-found: ignore

  release:
    name: Release build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison

      - name: Configure Release
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release --parallel 2

  sanitizers:
    name: ASan + UBSan smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison

      - name: Configure sanitizers
        run: cmake --preset sanitizers

      - name: Build sanitizers
        run: cmake --build --preset sanitizers --parallel 2

      - name: Run sanitizer smoke tests
        run: ctest --preset sanitizers-smoke

      - name: Upload sanitizer logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-logs
          path: |
            build/sanitizers/test-logs
            build/sanitizers/Testing/Temporary
          if-no-files-found: ignore

  thread-sanitizer:
    name: TSan smoke tests (nightly)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_quality) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source and GoogleTest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            flex \
            bison

      - name: Configure ThreadSanitizer
        run: cmake --preset tsan

      - name: Build ThreadSanitizer
        run: cmake --build --preset tsan --parallel 2

      - name: Run ThreadSanitizer smoke tests
        run: ctest --preset tsan-smoke

      - name: Upload ThreadSanitizer logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tsan-test-logs
          path: |
            build/tsan/test-logs
            build/tsan/Testing/Temporary
          if-no-files-found: ignore
